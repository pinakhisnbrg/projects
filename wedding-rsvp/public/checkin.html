<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wedding check-in</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><section class="panel" style="max-width:530px;margin:40px auto"><p class="micro muted">SECURE EVENT CHECK-IN</p><h1>Guest access verification</h1><p>Use a trusted QR scanner to read the pass code and paste it below. Administrator authorization is required to record arrivals.</p><label>Admin secret</label><input id="secret" type="password"><label>QR code value</label><input id="code" placeholder="PS-WEDDING:…"><button id="go">Check in guest</button><p id="status" role="status"></p></section></main><script type="module">
import{$,call}from'/common.js';
$('go').onclick=async()=>{try{const d=await call('checkin',{method:'POST',secret:$('secret').value,body:{code:$('code').value}});$('status').textContent='Checked in: '+d.guest;$('code').value=''}catch(e){$('status').textContent=e.message}};
</script></body></html>
